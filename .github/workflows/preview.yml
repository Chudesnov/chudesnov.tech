name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # The CMS (cms.chudesnov.tech) mirrors its drafts to this branch.
  push:
    branches: [cms-preview]

# The CMS can push several times in a row; only the latest state matters.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: CI
      url: ${{ github.event_name == 'push' && 'https://cms-preview-chudesnov.surge.sh' || format('https://pr-{0}-chudesnov.surge.sh', github.event.pull_request.number) }}

    env:
      PREVIEW_URL: ${{ github.event_name == 'push' && 'https://cms-preview-chudesnov.surge.sh' || format('https://pr-{0}-chudesnov.surge.sh', github.event.pull_request.number) }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Deploy preview
        if: github.event.action != 'closed'
        run: npx surge dist "$PREVIEW_URL" --token "${{ secrets.SURGE_TOKEN }}"

      - name: Tear down preview
        if: github.event.action == 'closed'
        run: npx surge teardown "$PREVIEW_URL" --token "${{ secrets.SURGE_TOKEN }}"

